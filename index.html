<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JS Practice — 100 Problems Compiler</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .badge {
    font-size: 11px; color: var(--muted); background: var(--panel2);
    padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border);
  }
  header a { color: var(--accent); text-decoration: none; font-size: 12px; margin-left: auto; }
  .layout { display: flex; flex: 1; min-height: 0; }

  /* Sidebar */
  aside {
    width: 320px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .search { padding: 8px; border-bottom: 1px solid var(--border); }
  .search input {
    width: 100%; padding: 8px 10px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .list { overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .sec-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); padding: 12px 14px 6px; position: sticky; top: 0;
    background: var(--panel); font-weight: 600;
  }
  .item {
    padding: 8px 14px; cursor: pointer; font-size: 13px; line-height: 1.4;
    border-left: 3px solid transparent; display: flex; gap: 8px;
  }
  .item:hover { background: var(--panel2); }
  .item.active { background: var(--panel2); border-left-color: var(--accent); }
  .item .num { color: var(--accent); font-weight: 600; flex-shrink: 0; min-width: 24px; }
  .item.done .num::after { content: " ✓"; color: var(--green); }
  .item .txt { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .item.active .txt { color: var(--text); }

  /* Difficulty badges */
  .diff {
    font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: .4px; flex-shrink: 0; align-self: center;
  }
  .diff.Easy   { color: var(--green);  background: rgba(63,185,80,.15);  border: 1px solid rgba(63,185,80,.35); }
  .diff.Medium { color: var(--yellow); background: rgba(210,153,34,.15);  border: 1px solid rgba(210,153,34,.35); }
  .diff.Hard   { color: var(--red);    background: rgba(248,81,73,.15);   border: 1px solid rgba(248,81,73,.35); }

  .filters { display: flex; gap: 6px; padding: 8px 8px 0; }
  .chip {
    flex: 1; text-align: center; font-size: 11px; padding: 5px 0; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer;
    font-weight: 600;
  }
  .chip.active { background: var(--panel2); color: var(--text); border-color: var(--accent); }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .problem {
    padding: 14px 18px; background: var(--panel2); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .problem .pnum { color: var(--accent); font-weight: 700; }
  .problem .ptext { font-size: 15px; line-height: 1.5; }
  .problem code {
    background: var(--bg); padding: 1px 6px; border-radius: 4px;
    font-family: var(--mono); font-size: 13px; color: var(--yellow);
  }
  .prow { display: flex; align-items: flex-start; gap: 12px; }
  .prow .ptext { flex: 1; }
  .concepts-btn {
    flex-shrink: 0; font-size: 12px; padding: 5px 12px; white-space: nowrap;
    border-color: rgba(88,166,255,.4); color: var(--accent); background: rgba(88,166,255,.08);
  }
  .concepts-btn:hover { background: rgba(88,166,255,.16); }
  .concepts-btn.open { background: var(--accent); color: #04121f; border-color: var(--accent); }
  .concepts-panel {
    margin-top: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 8px;
  }
  .cp-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
    font-weight: 600; margin-bottom: 8px;
  }
  .cp-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .cp-tag {
    font-size: 12px; font-family: var(--mono); padding: 3px 9px; border-radius: 6px;
    background: rgba(88,166,255,.12); color: var(--accent); border: 1px solid rgba(88,166,255,.3);
  }
  .cp-tip { font-size: 13px; line-height: 1.55; color: var(--text); }
  .cp-tip::before { content: "💡 "; }

  .editor-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .toolbar {
    padding: 8px 14px; display: flex; gap: 8px; align-items: center;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  button {
    font-family: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    cursor: pointer; font-weight: 500;
  }
  button:hover { background: #262c38; }
  button.run { background: var(--green); border-color: var(--green); color: #04260f; font-weight: 600; }
  button.run:hover { filter: brightness(1.1); }
  button.done-btn.is-done { background: var(--green); border-color: var(--green); color: #04260f; }
  .toolbar .hint { color: var(--muted); font-size: 11px; margin-left: auto; }
  textarea#code {
    flex: 1; width: 100%; border: none; outline: none; resize: none;
    background: var(--bg); color: var(--text); font-family: var(--mono);
    font-size: 14px; line-height: 1.6; padding: 14px 18px; tab-size: 2;
  }
  .ac-pop {
    position: fixed; z-index: 60; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.5); overflow: hidden;
    font-family: var(--mono); font-size: 13px; max-height: 200px; overflow-y: auto; display: none;
  }
  .ac-pop.show { display: block; }
  .ac-item { padding: 4px 12px 4px 10px; cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
  .ac-item .ac-name { color: var(--text); }
  .ac-item .ac-kind { color: var(--muted); font-size: 10px; margin-left: auto; text-transform: uppercase; }
  .ac-item.sel { background: var(--accent); }
  .ac-item.sel .ac-name { color: #04121f; }
  .ac-item.sel .ac-kind { color: rgba(4,18,31,.7); }
  .ac-hint-tab {
    position: fixed; z-index: 61; background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); font-size: 10px; padding: 1px 6px; border-radius: 4px; display: none;
  }
  .output {
    height: 34%; min-height: 120px; background: #010409; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .output .ohead {
    padding: 6px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
  }
  .output .ohead .clear { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 11px; text-transform: none; }
  .output .ohead .clear:hover { color: var(--text); }
  #console {
    flex: 1; overflow-y: auto; padding: 10px 14px; font-family: var(--mono);
    font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .log-line { padding: 1px 0; }
  .log-err { color: var(--red); }
  .log-warn { color: var(--yellow); }
  .log-info { color: var(--muted); }
  .log-ret { color: var(--green); }
  /* Answer panel (right side) */
  .ans-btn { border-color: rgba(210,153,34,.4); color: var(--yellow); background: rgba(210,153,34,.08); }
  .ans-btn:hover { background: rgba(210,153,34,.16); }
  .ans-btn.open { background: var(--yellow); color: #1a1200; border-color: var(--yellow); }
  #answer {
    width: 46%; min-width: 340px; max-width: 720px; flex-shrink: 0;
    background: var(--panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-width: 0;
  }
  #answer[hidden] { display: none; }
  .ans-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel2); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .ans-title { font-size: 13px; font-weight: 600; }
  .ans-num { color: var(--accent); font-weight: 700; }
  .ans-head .ans-copy { margin-left: auto; font-size: 12px; padding: 4px 10px; }
  .ans-head .ans-close { font-size: 13px; padding: 4px 9px; }
  .ans-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
  .ans-code {
    margin: 0; padding: 14px 16px; background: var(--bg); flex: 1;
    font-family: var(--mono); font-size: 13px; line-height: 1.6;
    white-space: pre;            /* NO word wrapping */
    overflow-x: auto;            /* horizontal scroll for long lines */
    tab-size: 2; color: var(--text);
  }
  .ans-code code { white-space: pre; font-family: inherit; }
  .ans-why {
    padding: 12px 16px; font-size: 13px; line-height: 1.55; color: var(--text);
    border-top: 1px solid var(--border); background: var(--panel);
  }
  .ans-why::before { content: "Why "; color: var(--muted); font-weight: 600; }
  .ans-why code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12px; color: var(--yellow); }

  @media (max-width: 720px) {
    #answer { width: 100%; position: absolute; right: 0; top: 0; height: 100%; z-index: 20; }
    aside { width: 100%; position: absolute; z-index: 10; height: 100%; display: none; }
    aside.open { display: flex; }
    .menu-btn { display: inline-block !important; }
  }
  .menu-btn { display: none; }
</style>
</head>
<body>
<header>
  <button class="menu-btn" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
  <h1>JS Practice</h1>
  <span class="badge" id="progress">0 / 100 done</span>
  <a href="https://github.com/rgangula5/js-practice" target="_blank">GitHub ↗</a>
</header>
<div class="layout">
  <aside>
    <div class="filters">
      <div class="chip active" data-diff="All" onclick="setFilterDiff('All')">All</div>
      <div class="chip" data-diff="Easy" onclick="setFilterDiff('Easy')">Easy</div>
      <div class="chip" data-diff="Medium" onclick="setFilterDiff('Medium')">Medium</div>
      <div class="chip" data-diff="Hard" onclick="setFilterDiff('Hard')">Hard</div>
    </div>
    <div class="search"><input id="search" placeholder="Search problems…" /></div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div class="problem">
      <div class="prow">
        <div class="ptext"><span class="pnum" id="pnum">#1</span> <span class="diff" id="pdiff"></span> <span id="ptext"></span></div>
        <button class="concepts-btn" id="conceptsBtn" onclick="toggleConcepts()">💡 Concepts</button>
      </div>
      <div class="concepts-panel" id="conceptsPanel" hidden>
        <div class="cp-label">Concepts to know for the expert solution</div>
        <div class="cp-tags" id="cpTags"></div>
        <div class="cp-tip" id="cpTip"></div>
      </div>
    </div>
    <div class="editor-wrap">
      <div class="toolbar">
        <button class="run" onclick="runCode()">▶ Run (Ctrl/⌘+Enter)</button>
        <button onclick="resetCode()">Reset</button>
        <button class="done-btn" id="doneBtn" onclick="toggleDone()">Mark done</button>
        <button class="ans-btn" id="ansBtn" onclick="toggleAnswer()">📖 Show answer</button>
        <span class="hint">Select code to run just that part · auto-saves</span>
      </div>
      <textarea id="code" spellcheck="false" placeholder="// Write your solution here, then click Run"></textarea>
      <div class="ac-pop" id="acPop"></div>
      <div class="output">
        <div class="ohead">Console <span class="clear" onclick="clearConsole()">clear</span></div>
        <div id="console"></div>
      </div>
    </div>
  </main>
  <section id="answer" hidden>
    <div class="ans-head">
      <span class="ans-title">Solution <span id="ansNum" class="ans-num"></span></span>
      <button class="ans-copy" onclick="copyAnswer()" title="Copy code">Copy</button>
      <button class="ans-close" onclick="hideAnswer()" title="Close">✕</button>
    </div>
    <div class="ans-body">
      <pre class="ans-code"><code id="ansCode"></code></pre>
      <div class="ans-why" id="ansWhy"></div>
    </div>
  </section>
</div>

<script src="problems.js?v=3"></script>
<script src="concepts.js?v=1"></script>
<script src="solutions.js?v=2"></script>
<script>
  let currentId = 1;
  let filterDiff = 'All';
  const $ = (s) => document.querySelector(s);
  const codeKey = (id) => 'jsp_code_' + id;
  const doneKey = () => 'jsp_done';

  function getDone() {
    try { return JSON.parse(localStorage.getItem(doneKey()) || '[]'); } catch { return []; }
  }
  function setDone(arr) { localStorage.setItem(doneKey(), JSON.stringify(arr)); }
  function isDone(id) { return getDone().includes(id); }

  function updateProgress() {
    $('#progress').textContent = getDone().length + ' / 100 done';
  }

  function renderList(filter = '') {
    const list = $('#list');
    list.innerHTML = '';
    let lastSec = '';
    const f = filter.toLowerCase();
    PROBLEMS.forEach((p) => {
      if (filterDiff !== 'All' && p.difficulty !== filterDiff) return;
      if (f && !(p.text.toLowerCase().includes(f) || String(p.id) === f)) return;
      if (p.section !== lastSec) {
        lastSec = p.section;
        const s = document.createElement('div');
        s.className = 'sec-title';
        s.textContent = p.section;
        list.appendChild(s);
      }
      const el = document.createElement('div');
      el.className = 'item' + (p.id === currentId ? ' active' : '') + (isDone(p.id) ? ' done' : '');
      const d = p.difficulty || '';
      el.innerHTML = '<span class="num">' + p.id + '</span><span class="txt"></span>' +
        (d ? '<span class="diff ' + d + '">' + d + '</span>' : '');
      el.querySelector('.txt').textContent = stripCode(p.text);
      el.onclick = () => { selectProblem(p.id); document.querySelector('aside').classList.remove('open'); };
      list.appendChild(el);
    });
  }

  function stripCode(t) { return t.replace(/`/g, ''); }

  // render problem text with inline code + arrows
  function renderText(t) {
    const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return esc(t).replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
  }

  function selectProblem(id) {
    // save current code first
    saveCode();
    currentId = id;
    const p = PROBLEMS.find((x) => x.id === id);
    $('#pnum').textContent = '#' + p.id;
    const db = $('#pdiff');
    db.textContent = p.difficulty || '';
    db.className = 'diff ' + (p.difficulty || '');
    db.style.display = p.difficulty ? '' : 'none';
    $('#ptext').innerHTML = renderText(p.text);
    renderConcepts(p);
    renderAnswer(p);
    const saved = localStorage.getItem(codeKey(id));
    $('#code').value = saved != null ? saved : starter(p);
    clearConsole();
    updateDoneBtn();
    renderList($('#search').value);
    localStorage.setItem('jsp_last', id);
    if (typeof hideAC === 'function') hideAC();
    $('#code').focus();
  }

  function starter(p) {
    return '// Problem #' + p.id + '\n// ' + stripCode(p.text) + '\n\n';
  }

  function saveCode() {
    if (currentId) localStorage.setItem(codeKey(currentId), $('#code').value);
  }
  function resetCode() {
    const p = PROBLEMS.find((x) => x.id === currentId);
    $('#code').value = starter(p);
    saveCode();
    $('#code').focus();
  }

  function updateDoneBtn() {
    const b = $('#doneBtn');
    if (isDone(currentId)) { b.textContent = '✓ Done'; b.classList.add('is-done'); }
    else { b.textContent = 'Mark done'; b.classList.remove('is-done'); }
  }
  function toggleDone() {
    let d = getDone();
    if (d.includes(currentId)) d = d.filter((x) => x !== currentId);
    else d.push(currentId);
    setDone(d);
    updateDoneBtn(); updateProgress(); renderList($('#search').value);
  }

  function renderConcepts(p) {
    const c = (typeof CONCEPTS !== 'undefined') ? CONCEPTS[p.id] : null;
    const tagsEl = $('#cpTags'), tipEl = $('#cpTip');
    if (!c) {
      tagsEl.innerHTML = '';
      tipEl.textContent = 'Concept notes coming soon for this one.';
      return;
    }
    tagsEl.innerHTML = c.tags.map((t) => {
      const s = document.createElement('span');
      s.className = 'cp-tag';
      s.textContent = t;
      return s.outerHTML;
    }).join('');
    tipEl.textContent = c.tip;
    // always start collapsed when switching problems
    $('#conceptsPanel').hidden = true;
    $('#conceptsBtn').classList.remove('open');
  }

  function toggleConcepts() {
    const panel = $('#conceptsPanel');
    panel.hidden = !panel.hidden;
    $('#conceptsBtn').classList.toggle('open', !panel.hidden);
  }

  let currentAnswerCode = '';
  function renderAnswer(p) {
    const s = (typeof SOLUTIONS !== 'undefined') ? SOLUTIONS[p.id] : null;
    $('#ansNum').textContent = '#' + p.id;
    if (!s) {
      currentAnswerCode = '';
      $('#ansCode').textContent = '// Solution coming soon.';
      $('#ansWhy').innerHTML = '';
      return;
    }
    currentAnswerCode = s.code;
    $('#ansCode').textContent = s.code;   // textContent = safe, keeps exact formatting
    $('#ansWhy').innerHTML = s.why ? renderText(s.why) : '';
    $('#ansWhy').style.display = s.why ? '' : 'none';
    // always collapse the answer when switching problems
    hideAnswer();
  }

  function toggleAnswer() {
    const a = $('#answer');
    a.hidden = !a.hidden;
    $('#ansBtn').classList.toggle('open', !a.hidden);
  }
  function hideAnswer() {
    $('#answer').hidden = true;
    $('#ansBtn').classList.remove('open');
  }
  function copyAnswer() {
    if (!currentAnswerCode) return;
    navigator.clipboard.writeText(currentAnswerCode).then(() => {
      const b = document.querySelector('.ans-copy');
      const t = b.textContent; b.textContent = 'Copied!';
      setTimeout(() => { b.textContent = t; }, 1200);
    }).catch(() => {});
  }

  function setFilterDiff(d) {
    filterDiff = d;
    document.querySelectorAll('.chip').forEach((c) =>
      c.classList.toggle('active', c.dataset.diff === d));
    renderList($('#search').value);
  }

  function clearConsole() { $('#console').innerHTML = ''; }
  function appendLine(text, cls) {
    const div = document.createElement('div');
    div.className = 'log-line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    $('#console').appendChild(div);
    $('#console').scrollTop = $('#console').scrollHeight;
  }

  function fmt(v) {
    if (typeof v === 'string') return v;
    if (v instanceof Error) return v.stack || v.toString();
    try { return JSON.stringify(v, (k, val) => typeof val === 'undefined' ? '__undefined__' : val, 2)
        .replace(/"__undefined__"/g, 'undefined'); }
    catch { return String(v); }
  }

  async function runCode() {
    saveCode();
    clearConsole();
    // Run only the selected text if any is highlighted (like a SQL client); else run everything.
    const ta = $('#code');
    const hasSel = ta.selectionStart !== ta.selectionEnd;
    const code = hasSel ? ta.value.slice(ta.selectionStart, ta.selectionEnd) : ta.value;
    if (hasSel) appendLine('▸ running selection', 'log-info');
    const capture = {
      log: (...a) => appendLine(a.map(fmt).join(' ')),
      error: (...a) => appendLine(a.map(fmt).join(' '), 'log-err'),
      warn: (...a) => appendLine(a.map(fmt).join(' '), 'log-warn'),
      info: (...a) => appendLine(a.map(fmt).join(' '), 'log-info'),
      table: (v) => appendLine(fmt(v)),
    };
    try {
      const fn = new Function('console', '"use strict";\n' + code + '\n//# sourceURL=solution.js');
      const ret = fn(capture);
      if (ret instanceof Promise) {
        await ret;
      }
      appendLine('▸ done', 'log-ret');
    } catch (e) {
      appendLine(e && e.stack ? e.stack : String(e), 'log-err');
    }
  }

  /* ---------- Autocomplete ---------- */
  const JS_BUILTINS = ['const','let','var','function','return','if','else','for','while','do','switch','case','break','continue','new','class','extends','super','this','typeof','instanceof','of','in','try','catch','finally','throw','await','async','yield','true','false','null','undefined','console','log','error','warn','Math','max','min','floor','ceil','round','abs','sqrt','pow','random','Number','isInteger','isNaN','parseInt','parseFloat','String','Array','isArray','from','Object','keys','values','entries','fromEntries','assign','JSON','stringify','parse','Set','Map','Promise','all','race','resolve','reject','length','push','pop','shift','unshift','slice','splice','concat','map','filter','reduce','reduceRight','forEach','find','findIndex','some','every','includes','indexOf','lastIndexOf','join','split','sort','reverse','flat','flatMap','fill','repeat','padStart','padEnd','trim','toUpperCase','toLowerCase','charAt','charCodeAt','fromCharCode','replace','replaceAll','match','startsWith','endsWith','substring','has','get','add','delete','size','toFixed','setTimeout'];
  const acPop = $('#acPop');
  let acItems = [], acSel = 0, acStart = 0, acOpen = false;

  function collectIdents(code) {
    const set = new Set();
    let m;
    const push = (s) => { if (s && /^[A-Za-z_$][\w$]*$/.test(s)) set.add(s); };
    const declRe = /\b(?:const|let|var|function|class)\s+([A-Za-z_$][\w$]*)/g;
    while ((m = declRe.exec(code))) push(m[1]);
    // function/arrow param lists
    const parenRe = /(?:function\s*[\w$]*\s*|\b)\(([^()]*)\)\s*(?:=>|\{)/g;
    while ((m = parenRe.exec(code))) m[1].split(',').forEach(p => push(p.trim().replace(/[:=].*$/, '').replace(/[.\s]/g, '').replace(/[{}\[\]]/g, '')));
    // single-arg arrow: x =>
    const arrowRe = /([A-Za-z_$][\w$]*)\s*=>/g;
    while ((m = arrowRe.exec(code))) push(m[1]);
    // for (const x  /  for (let [a,b]
    const forRe = /for\s*\(\s*(?:const|let|var)\s+([A-Za-z_$][\w$]*)/g;
    while ((m = forRe.exec(code))) push(m[1]);
    return set;
  }

  function currentToken(ta) {
    const upto = ta.value.slice(0, ta.selectionStart);
    const mm = upto.match(/[\w$]+$/);
    return mm ? { text: mm[0], start: ta.selectionStart - mm[0].length } : { text: '', start: ta.selectionStart };
  }

  function updateAutocomplete() {
    const ta = $('#code');
    const tok = currentToken(ta);
    if (tok.text.length < 1 || ta.selectionStart !== ta.selectionEnd) { hideAC(); return; }
    const declared = collectIdents(ta.value);
    const pool = new Set([...declared, ...JS_BUILTINS]);
    const low = tok.text.toLowerCase();
    const declaredSet = declared;
    const matches = [...pool]
      .filter(w => w.toLowerCase().startsWith(low) && w !== tok.text)
      .sort((a, b) => {
        const da = declaredSet.has(a), db = declaredSet.has(b);
        if (da !== db) return da ? -1 : 1;          // your variables first
        return a.length - b.length || a.localeCompare(b);
      })
      .slice(0, 8);
    if (!matches.length) { hideAC(); return; }
    acItems = matches; acSel = 0; acStart = tok.start; acOpen = true;
    renderAC(declaredSet);
    positionAC(ta);
  }

  function renderAC(declaredSet) {
    acPop.innerHTML = '';
    acItems.forEach((w, i) => {
      const it = document.createElement('div');
      it.className = 'ac-item' + (i === acSel ? ' sel' : '');
      it.innerHTML = '<span class="ac-name"></span><span class="ac-kind">' + (declaredSet.has(w) ? 'var' : 'js') + '</span>';
      it.querySelector('.ac-name').textContent = w;
      it.onmousedown = (e) => { e.preventDefault(); acSel = i; acceptAC(); };
      acPop.appendChild(it);
    });
    acPop.classList.add('show');
  }

  function positionAC(ta) {
    const c = caretCoords(ta, ta.selectionStart);
    acPop.style.left = c.left + 'px';
    acPop.style.top = c.top + 'px';
  }

  function hideAC() { acOpen = false; acPop.classList.remove('show'); }

  function acceptAC() {
    if (!acOpen || !acItems.length) return;
    const ta = $('#code');
    const word = acItems[acSel];
    const end = ta.selectionStart;
    ta.value = ta.value.slice(0, acStart) + word + ta.value.slice(end);
    const pos = acStart + word.length;
    ta.selectionStart = ta.selectionEnd = pos;
    hideAC(); saveCode();
  }

  // Measure caret pixel position (viewport coords) via a mirror div
  function caretCoords(ta, pos) {
    const div = document.createElement('div');
    const s = getComputedStyle(ta);
    ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','textTransform','wordSpacing','paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','boxSizing','tabSize'].forEach(k => div.style[k] = s[k]);
    div.style.position = 'absolute'; div.style.visibility = 'hidden'; div.style.whiteSpace = 'pre-wrap';
    div.style.wordWrap = 'break-word'; div.style.width = ta.clientWidth + 'px';
    div.textContent = ta.value.slice(0, pos);
    const span = document.createElement('span'); span.textContent = ta.value.slice(pos) || '.';
    div.appendChild(span);
    document.body.appendChild(div);
    const rect = ta.getBoundingClientRect();
    const left = rect.left + span.offsetLeft - ta.scrollLeft;
    const top = rect.top + span.offsetTop - ta.scrollTop + (parseFloat(s.lineHeight) || 20);
    document.body.removeChild(div);
    // keep within viewport
    return { left: Math.min(left, window.innerWidth - 180), top: Math.min(top, window.innerHeight - 60) };
  }

  // events
  $('#search').addEventListener('input', (e) => renderList(e.target.value));
  $('#code').addEventListener('input', updateAutocomplete);
  $('#code').addEventListener('blur', () => setTimeout(hideAC, 120));
  $('#code').addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); hideAC(); runCode(); return; }
    if (acOpen) {
      if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); acceptAC(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); acSel = (acSel + 1) % acItems.length; renderAC(collectIdents($('#code').value)); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); acSel = (acSel - 1 + acItems.length) % acItems.length; renderAC(collectIdents($('#code').value)); return; }
      if (e.key === 'Escape') { e.preventDefault(); hideAC(); return; }
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const el = e.target, ss = el.selectionStart, en = el.selectionEnd;
      el.value = el.value.slice(0, ss) + '  ' + el.value.slice(en);
      el.selectionStart = el.selectionEnd = ss + 2;
    }
  });
  window.addEventListener('beforeunload', saveCode);

  // init
  renderList();
  updateProgress();
  const last = parseInt(localStorage.getItem('jsp_last') || '1', 10);
  selectProblem(PROBLEMS.find((p) => p.id === last) ? last : 1);
</script>
</body>
</html>
