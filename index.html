<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JS Practice — 100 Problems Compiler</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .badge {
    font-size: 11px; color: var(--muted); background: var(--panel2);
    padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border);
  }
  header a { color: var(--accent); text-decoration: none; font-size: 12px; margin-left: auto; }
  .layout { display: flex; flex: 1; min-height: 0; }

  /* Sidebar */
  aside {
    width: 320px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .search { padding: 8px; border-bottom: 1px solid var(--border); }
  .search input {
    width: 100%; padding: 8px 10px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .list { overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .sec-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); padding: 12px 14px 6px; position: sticky; top: 0;
    background: var(--panel); font-weight: 600;
  }
  .item {
    padding: 8px 14px; cursor: pointer; font-size: 13px; line-height: 1.4;
    border-left: 3px solid transparent; display: flex; gap: 8px;
  }
  .item:hover { background: var(--panel2); }
  .item.active { background: var(--panel2); border-left-color: var(--accent); }
  .item .num { color: var(--accent); font-weight: 600; flex-shrink: 0; min-width: 24px; }
  .item.done .num::after { content: " ✓"; color: var(--green); }
  .item .txt { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .item.active .txt { color: var(--text); }

  /* Difficulty badges */
  .diff {
    font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: .4px; flex-shrink: 0; align-self: center;
  }
  .diff.Easy   { color: var(--green);  background: rgba(63,185,80,.15);  border: 1px solid rgba(63,185,80,.35); }
  .diff.Medium { color: var(--yellow); background: rgba(210,153,34,.15);  border: 1px solid rgba(210,153,34,.35); }
  .diff.Hard   { color: var(--red);    background: rgba(248,81,73,.15);   border: 1px solid rgba(248,81,73,.35); }

  .filters { display: flex; gap: 6px; padding: 8px 8px 0; }
  .chip {
    flex: 1; text-align: center; font-size: 11px; padding: 5px 0; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer;
    font-weight: 600;
  }
  .chip.active { background: var(--panel2); color: var(--text); border-color: var(--accent); }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .problem {
    padding: 14px 18px; background: var(--panel2); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .problem .pnum { color: var(--accent); font-weight: 700; }
  .problem .ptext { font-size: 15px; line-height: 1.5; }
  .problem code {
    background: var(--bg); padding: 1px 6px; border-radius: 4px;
    font-family: var(--mono); font-size: 13px; color: var(--yellow);
  }
  .editor-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .toolbar {
    padding: 8px 14px; display: flex; gap: 8px; align-items: center;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  button {
    font-family: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    cursor: pointer; font-weight: 500;
  }
  button:hover { background: #262c38; }
  button.run { background: var(--green); border-color: var(--green); color: #04260f; font-weight: 600; }
  button.run:hover { filter: brightness(1.1); }
  button.done-btn.is-done { background: var(--green); border-color: var(--green); color: #04260f; }
  .toolbar .hint { color: var(--muted); font-size: 11px; margin-left: auto; }
  textarea#code {
    flex: 1; width: 100%; border: none; outline: none; resize: none;
    background: var(--bg); color: var(--text); font-family: var(--mono);
    font-size: 14px; line-height: 1.6; padding: 14px 18px; tab-size: 2;
  }
  .output {
    height: 34%; min-height: 120px; background: #010409; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .output .ohead {
    padding: 6px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
  }
  .output .ohead .clear { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 11px; text-transform: none; }
  .output .ohead .clear:hover { color: var(--text); }
  #console {
    flex: 1; overflow-y: auto; padding: 10px 14px; font-family: var(--mono);
    font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .log-line { padding: 1px 0; }
  .log-err { color: var(--red); }
  .log-warn { color: var(--yellow); }
  .log-info { color: var(--muted); }
  .log-ret { color: var(--green); }
  @media (max-width: 720px) {
    aside { width: 100%; position: absolute; z-index: 10; height: 100%; display: none; }
    aside.open { display: flex; }
    .menu-btn { display: inline-block !important; }
  }
  .menu-btn { display: none; }
</style>
</head>
<body>
<header>
  <button class="menu-btn" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
  <h1>JS Practice</h1>
  <span class="badge" id="progress">0 / 100 done</span>
  <a href="https://github.com/rgangula5/js-practice" target="_blank">GitHub ↗</a>
</header>
<div class="layout">
  <aside>
    <div class="filters">
      <div class="chip active" data-diff="All" onclick="setFilterDiff('All')">All</div>
      <div class="chip" data-diff="Easy" onclick="setFilterDiff('Easy')">Easy</div>
      <div class="chip" data-diff="Medium" onclick="setFilterDiff('Medium')">Medium</div>
      <div class="chip" data-diff="Hard" onclick="setFilterDiff('Hard')">Hard</div>
    </div>
    <div class="search"><input id="search" placeholder="Search problems…" /></div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div class="problem">
      <div class="ptext"><span class="pnum" id="pnum">#1</span> <span class="diff" id="pdiff"></span> <span id="ptext"></span></div>
    </div>
    <div class="editor-wrap">
      <div class="toolbar">
        <button class="run" onclick="runCode()">▶ Run (Ctrl/⌘+Enter)</button>
        <button onclick="resetCode()">Reset</button>
        <button class="done-btn" id="doneBtn" onclick="toggleDone()">Mark done</button>
        <span class="hint">Code auto-saves in your browser</span>
      </div>
      <textarea id="code" spellcheck="false" placeholder="// Write your solution here, then click Run"></textarea>
      <div class="output">
        <div class="ohead">Console <span class="clear" onclick="clearConsole()">clear</span></div>
        <div id="console"></div>
      </div>
    </div>
  </main>
</div>

<script src="problems.js?v=3"></script>
<script>
  let currentId = 1;
  let filterDiff = 'All';
  const $ = (s) => document.querySelector(s);
  const codeKey = (id) => 'jsp_code_' + id;
  const doneKey = () => 'jsp_done';

  function getDone() {
    try { return JSON.parse(localStorage.getItem(doneKey()) || '[]'); } catch { return []; }
  }
  function setDone(arr) { localStorage.setItem(doneKey(), JSON.stringify(arr)); }
  function isDone(id) { return getDone().includes(id); }

  function updateProgress() {
    $('#progress').textContent = getDone().length + ' / 100 done';
  }

  function renderList(filter = '') {
    const list = $('#list');
    list.innerHTML = '';
    let lastSec = '';
    const f = filter.toLowerCase();
    PROBLEMS.forEach((p) => {
      if (filterDiff !== 'All' && p.difficulty !== filterDiff) return;
      if (f && !(p.text.toLowerCase().includes(f) || String(p.id) === f)) return;
      if (p.section !== lastSec) {
        lastSec = p.section;
        const s = document.createElement('div');
        s.className = 'sec-title';
        s.textContent = p.section;
        list.appendChild(s);
      }
      const el = document.createElement('div');
      el.className = 'item' + (p.id === currentId ? ' active' : '') + (isDone(p.id) ? ' done' : '');
      const d = p.difficulty || '';
      el.innerHTML = '<span class="num">' + p.id + '</span><span class="txt"></span>' +
        (d ? '<span class="diff ' + d + '">' + d + '</span>' : '');
      el.querySelector('.txt').textContent = stripCode(p.text);
      el.onclick = () => { selectProblem(p.id); document.querySelector('aside').classList.remove('open'); };
      list.appendChild(el);
    });
  }

  function stripCode(t) { return t.replace(/`/g, ''); }

  // render problem text with inline code + arrows
  function renderText(t) {
    const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return esc(t).replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
  }

  function selectProblem(id) {
    // save current code first
    saveCode();
    currentId = id;
    const p = PROBLEMS.find((x) => x.id === id);
    $('#pnum').textContent = '#' + p.id;
    const db = $('#pdiff');
    db.textContent = p.difficulty || '';
    db.className = 'diff ' + (p.difficulty || '');
    db.style.display = p.difficulty ? '' : 'none';
    $('#ptext').innerHTML = renderText(p.text);
    const saved = localStorage.getItem(codeKey(id));
    $('#code').value = saved != null ? saved : starter(p);
    clearConsole();
    updateDoneBtn();
    renderList($('#search').value);
    localStorage.setItem('jsp_last', id);
    $('#code').focus();
  }

  function starter(p) {
    return '// Problem #' + p.id + '\n// ' + stripCode(p.text) + '\n\n';
  }

  function saveCode() {
    if (currentId) localStorage.setItem(codeKey(currentId), $('#code').value);
  }
  function resetCode() {
    const p = PROBLEMS.find((x) => x.id === currentId);
    $('#code').value = starter(p);
    saveCode();
    $('#code').focus();
  }

  function updateDoneBtn() {
    const b = $('#doneBtn');
    if (isDone(currentId)) { b.textContent = '✓ Done'; b.classList.add('is-done'); }
    else { b.textContent = 'Mark done'; b.classList.remove('is-done'); }
  }
  function toggleDone() {
    let d = getDone();
    if (d.includes(currentId)) d = d.filter((x) => x !== currentId);
    else d.push(currentId);
    setDone(d);
    updateDoneBtn(); updateProgress(); renderList($('#search').value);
  }

  function setFilterDiff(d) {
    filterDiff = d;
    document.querySelectorAll('.chip').forEach((c) =>
      c.classList.toggle('active', c.dataset.diff === d));
    renderList($('#search').value);
  }

  function clearConsole() { $('#console').innerHTML = ''; }
  function appendLine(text, cls) {
    const div = document.createElement('div');
    div.className = 'log-line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    $('#console').appendChild(div);
    $('#console').scrollTop = $('#console').scrollHeight;
  }

  function fmt(v) {
    if (typeof v === 'string') return v;
    if (v instanceof Error) return v.stack || v.toString();
    try { return JSON.stringify(v, (k, val) => typeof val === 'undefined' ? '__undefined__' : val, 2)
        .replace(/"__undefined__"/g, 'undefined'); }
    catch { return String(v); }
  }

  async function runCode() {
    saveCode();
    clearConsole();
    const code = $('#code').value;
    const capture = {
      log: (...a) => appendLine(a.map(fmt).join(' ')),
      error: (...a) => appendLine(a.map(fmt).join(' '), 'log-err'),
      warn: (...a) => appendLine(a.map(fmt).join(' '), 'log-warn'),
      info: (...a) => appendLine(a.map(fmt).join(' '), 'log-info'),
      table: (v) => appendLine(fmt(v)),
    };
    try {
      const fn = new Function('console', '"use strict";\n' + code + '\n//# sourceURL=solution.js');
      const ret = fn(capture);
      if (ret instanceof Promise) {
        await ret;
      }
      appendLine('▸ done', 'log-ret');
    } catch (e) {
      appendLine(e && e.stack ? e.stack : String(e), 'log-err');
    }
  }

  // events
  $('#search').addEventListener('input', (e) => renderList(e.target.value));
  $('#code').addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const el = e.target, s = el.selectionStart, en = el.selectionEnd;
      el.value = el.value.slice(0, s) + '  ' + el.value.slice(en);
      el.selectionStart = el.selectionEnd = s + 2;
    }
  });
  window.addEventListener('beforeunload', saveCode);

  // init
  renderList();
  updateProgress();
  const last = parseInt(localStorage.getItem('jsp_last') || '1', 10);
  selectProblem(PROBLEMS.find((p) => p.id === last) ? last : 1);
</script>
</body>
</html>
